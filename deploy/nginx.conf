# Nginx reverse proxy: public port 80 -> Gunicorn on 127.0.0.1:8000
# Copy to /etc/nginx/sites-available/smartfood, then:
#   sudo ln -s /etc/nginx/sites-available/smartfood /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;
    client_max_body_size 6M;   # slightly above the app's 5 MB upload limit

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
