{% extends "base.html" %}
{% block title %}Register · Smart Food Rescue{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <div class="card"><div class="card-body p-4">
    <h2 class="h4 mb-3">Create an account</h2>
    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">I am a</label>
        <div>
          <input class="btn-check" type="radio" name="role" id="role-donor" value="donor" {% if form.get('role') != 'ngo' %}checked{% endif %}>
          <label class="btn btn-outline-success" for="role-donor"><i class="bi bi-shop"></i> Food donor</label>
          <input class="btn-check" type="radio" name="role" id="role-ngo" value="ngo" {% if form.get('role') == 'ngo' %}checked{% endif %}>
          <label class="btn btn-outline-success" for="role-ngo"><i class="bi bi-people"></i> NGO</label>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3"><label class="form-label">Your name</label>
          <input class="form-control" name="name" value="{{ form.get('name', '') }}" required></div>
        <div class="col-md-6 mb-3"><label class="form-label">Organisation</label>
          <input class="form-control" name="organization" value="{{ form.get('organization', '') }}" placeholder="e.g. Hostel J Mess" required></div>
        <div class="col-md-6 mb-3"><label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" value="{{ form.get('email', '') }}" required></div>
        <div class="col-md-6 mb-3"><label class="form-label">Phone</label>
          <input class="form-control" name="phone" value="{{ form.get('phone', '') }}"></div>
      </div>
      <div class="mb-3"><label class="form-label">Password <small class="text-muted">(min. 8 characters)</small></label>
        <input class="form-control" type="password" name="password" minlength="8" required></div>
      <div class="mb-3" id="ngo-doc">
        <label class="form-label">NGO registration certificate <small class="text-muted">(NGOs only · PDF or image, max 5 MB)</small></label>
        <input class="form-control" type="file" name="verification_doc" accept=".pdf,.png,.jpg,.jpeg,.webp">
      </div>
      <button class="btn btn-success w-100">Register</button>
    </form>
  </div></div>
</div></div>
<script>
  const docBox = document.getElementById('ngo-doc');
  const sync = () => docBox.style.display = document.getElementById('role-ngo').checked ? '' : 'none';
  document.querySelectorAll('input[name=role]').forEach(r => r.addEventListener('change', sync)); sync();
</script>
{% endblock %}
