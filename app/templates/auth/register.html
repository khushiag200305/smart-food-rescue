{% extends "base.html" %}
{% from "_ui.html" import icon %}
{% block title %}Create an account | Smart Food Rescue{% endblock %}
{% block content %}
<div class="medium">
  <div class="page-head"><div><h1>Create an account</h1><p>Kitchens post surplus food. NGOs collect it.</p></div></div>
  <form class="sheet" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <fieldset style="border:0;padding:0;margin:0">
      <legend class="sr-only">Account type</legend>
      <div class="choice">
        <input type="radio" name="role" id="role-donor" value="donor" {% if form.get('role') != 'ngo' %}checked{% endif %}>
        <label for="role-donor"><span class="dot">{{ icon('bowl', 22) }}</span><span><strong>I have food to give</strong><small>Mess, restaurant, hotel or cafeteria</small></span></label>
        <input type="radio" name="role" id="role-ngo" value="ngo" {% if form.get('role') == 'ngo' %}checked{% endif %}>
        <label for="role-ngo"><span class="dot">{{ icon('hands', 22) }}</span><span><strong>We collect food</strong><small>NGO or charity, verified by an admin</small></span></label>
      </div>
    </fieldset>

    <div class="grid-2">
      <div class="field"><label for="name">Your name</label>
        <input id="name" name="name" value="{{ form.get('name', '') }}" autocomplete="name" required></div>
      <div class="field"><label for="organization">Organisation</label>
        <input id="organization" name="organization" value="{{ form.get('organization', '') }}" placeholder="e.g. Hostel J Mess" required></div>
      <div class="field"><label for="reg-email">Email</label>
        <input id="reg-email" type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required></div>
      <div class="field"><label for="phone">Phone <span class="hint">(shared once a pickup is approved)</span></label>
        <input id="phone" name="phone" value="{{ form.get('phone', '') }}" autocomplete="tel"></div>
    </div>
    <div class="field"><label for="reg-password">Password <span class="hint">(at least 8 characters)</span></label>
      <input id="reg-password" type="password" name="password" minlength="8" autocomplete="new-password" required></div>
    <div class="field" id="ngo-doc">
      <label for="doc">NGO registration certificate <span class="hint">(PDF or image, up to 5 MB)</span></label>
      <input id="doc" type="file" name="verification_doc" accept=".pdf,.png,.jpg,.jpeg,.webp">
    </div>
    <button class="btn btn-primary btn-block">Create account</button>
  </form>
  <p class="muted" style="margin-top:1rem">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
