{% extends "base.html" %}
{% block title %}Log in | Smart Food Rescue{% endblock %}
{% block content %}
<div class="narrow">
  <div class="page-head"><div><h1>Log in</h1><p>Donors, NGOs and admins all log in here.</p></div></div>
  <form class="panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="email" required autofocus></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="muted" style="margin-top:1rem">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
